<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>의정부 도서관 재고확인</title>
<style>
/* 어두운 바탕. 도면·배치도는 흰 종이 그대로 둔다(그래야 선이 보인다). */
:root{--ink:#E4E8EC;--muted:#93A0AD;--hair:#2C333B;--bg:#14181C;--sunk:#1C232A;
 --card:#212A32;--f1:#6BA6EE;--f2:#96CC62;--f3:#E0A45C;--ok:#3ECF8E;
 --mono:"Consolas","D2Coding",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--hair);
 padding:14px 18px 0}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.tabs{display:flex;gap:4px}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:14.5px;
 padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:650;border-bottom-color:var(--ink);background:var(--sunk)}
main{padding:18px}
.planwrap{position:relative;border:1px solid var(--hair);border-radius:10px;overflow:hidden;
 background:var(--sunk);margin-bottom:8px}
.planwrap img{display:block;width:100%;height:auto}
.mk{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mk b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
 background:var(--f1);color:#fff;font:600 12px/1 var(--mono);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.mk.hit b{outline:3px solid #F2B705;outline-offset:2px}
.mk span{position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;
 font:600 10.5px/1.5 var(--mono);background:rgba(255,255,255,.94);padding:1.5px 6px;
 border:1px solid rgba(0,0,0,.22);border-radius:2px}
.note{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.row{border-bottom:1px solid var(--hair)}
.rhead{width:100%;appearance:none;background:none;border:0;text-align:left;cursor:pointer;
 display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
 padding:13px 4px;font:inherit;color:var(--ink)}
.rhead:hover{background:var(--sunk)}
.rcode{font:650 13px/1 var(--mono);letter-spacing:.02em;min-width:66px}
.f1 .rcode{color:var(--f1)}.f2 .rcode{color:var(--f2)}.f3 .rcode{color:var(--f3)}
.rname{font-size:14.5px}
.rmeta{display:block;color:var(--muted);font:12px/1.5 var(--mono);margin-top:1px}
.prog{font:600 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
.prog.done{color:var(--ok)}
.prog.none{opacity:.45}
.panel{display:none;padding:4px 4px 20px}
.row.open .panel{display:block}
/* PDF 에서 뽑은 상세도 — 제품 펼치면 맨 위에 뜬다(현황판과 같은 그림) */
.ref{margin:10px 0 4px;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--sunk)}
.ref img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
.rnote{margin:0;padding:9px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--hair)}
.parthead{margin:22px 0 2px;font-size:13px;font-weight:650;color:var(--muted);
 display:flex;align-items:center;gap:8px}
.parthead::after{content:"";flex:1;height:1px;background:var(--hair)}
/* 부품 도면을 한 장에 모아둔 것 */
.allw{border-top:1px solid var(--hair);background:var(--card)}
.allh{font-size:12px;color:var(--muted);padding:8px 14px 0}
.allimg{display:block;width:100%;max-height:420px;object-fit:contain;object-position:center;
 padding:8px 14px 12px;cursor:zoom-in}
.grp{margin-top:14px;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.gtop{display:flex;gap:14px;padding:12px 14px;background:var(--sunk);align-items:flex-start;flex-wrap:wrap}
.gtop img{width:190px;max-width:45vw;max-height:150px;object-fit:contain;object-position:top;
 border:1px solid var(--hair);border-radius:6px;background:#fff;cursor:zoom-in}
.gtit{font:650 12.5px/1.6 var(--mono)}
.gsub{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-top:1px solid var(--hair);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.on td{background:#1B3A2C}
tr.on td.pn{text-decoration:line-through;text-decoration-color:var(--muted)}
.chk{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
.dw{width:46px;height:34px;object-fit:cover;border:1px solid var(--hair);border-radius:4px;cursor:zoom-in;background:#fff}
.nodw{width:46px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:10px;
 border:1px dashed var(--hair);border-radius:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tools button{appearance:none;font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;
 border:1px solid var(--hair);background:var(--card);color:var(--ink);cursor:pointer}
.tools button:hover{background:var(--sunk)}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}
/* 창 크기를 고정한다 — 도면마다 비율이 달라도 화살표가 제자리에 있도록.
   ★ display 는 반드시 [open] 에만 준다. dialog 에 그냥 display:flex 를 주면
     닫아도 브라우저가 감추지 못해 «잔상» 처럼 큰 흰 상자가 남는다. */
dialog{border:0;border-radius:12px;padding:0;background:var(--bg);color:var(--ink);
 width:min(96vw,1500px);height:94vh;max-width:none;max-height:none;overflow:hidden}
dialog:not([open]){display:none}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.6)}
/* 돋보기 막대 — 위에 고정해 두고 확대한 뒤 끌어서 훑는다 */
.dbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
 border-bottom:1px solid var(--hair);background:var(--sunk)}
.dbar button{appearance:none;border:1px solid var(--hair);background:var(--card);border-radius:7px;
 min-width:34px;height:32px;font:600 15px/1 inherit;cursor:pointer;color:var(--ink)}
.dbar button:hover{background:var(--sunk)}
.dbar .zlv{font:600 12px var(--mono);color:var(--muted);min-width:46px;text-align:center}
.dbar .dhint{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dbar .dclose{font-size:20px}
.dwrap{position:relative;flex:1;min-height:0;background:var(--sunk);overflow:hidden;
 touch-action:none}
.dwrap.grab{cursor:grab}
.dwrap.grabbing{cursor:grabbing}
dialog img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;
 width:auto;height:auto;background:#fff;transform-origin:center center;
 user-select:none;-webkit-user-drag:none}
@media(max-width:640px){.dbar .dhint{display:none}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:90px;border:0;
 background:rgba(20,24,28,.55);color:#fff;font-size:24px;cursor:pointer;border-radius:8px;z-index:3}
.nav:hover{background:rgba(20,24,28,.85)}
.prev{left:10px}.next{right:10px}
dialog .cap{font:13px/1.7 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;flex:none;
 padding:10px 14px;border-top:1px solid var(--hair);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
dialog .cap b{font-size:15px}
dialog .cap .q{font:650 13px var(--mono);color:var(--ok)}
dialog .cap .c2{font:12px var(--mono);color:var(--muted)}
.dchk{display:flex;gap:8px;align-items:center;padding:0 14px 12px;font-size:14px;cursor:pointer;flex:none}
.dchk input{width:20px;height:20px;accent-color:var(--ok)}
@media(max-width:640px){.rhead{grid-template-columns:auto 1fr;gap:8px}.rmeta{display:none}
 th.h,td.h{display:none}main{padding:12px}}
</style></head><body>
<header>
  <h1>의정부 도서관 &middot; 재고확인</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<dialog id="dlg">
  <div class="dbar">
    <button type="button" data-z="out" title="축소">&minus;</button>
    <span class="zlv">100%</span>
    <button type="button" data-z="in" title="확대">+</button>
    <button type="button" data-z="fit" title="처음 크기로">맞춤</button>
    <span class="dhint">확대한 뒤 끌어서 움직이세요 &middot; 휠로도 확대</span>
    <button type="button" class="dclose" title="닫기">&times;</button>
  </div>
  <div class="dwrap">
    <button class="nav prev" type="button" aria-label="이전 부품">&#10094;</button>
    <img alt="" draggable="false">
    <button class="nav next" type="button" aria-label="다음 부품">&#10095;</button>
  </div>
  <div class="cap"></div>
  <label class="dchk"><input type="checkbox"> 확인함</label>
</dialog>

const KEY = 'ujlb-stock-v1';
let ST = {};
try{ ST = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ ST = {}; }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} };
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const OPEN = new Set();     // 펼쳐둔 제품 줄 — 다시 그려도 그대로 둔다
let cur = DATA.floors[0].id;
const tabs = document.getElementById('tabs');
DATA.floors.forEach(f => {
  const b = document.createElement('button');
  b.textContent = f.label; b.dataset.f = f.id;
  b.onclick = () => { cur = f.id; render(); };
  tabs.appendChild(b);
});

function count(g){ return [g.parts.filter(p=>ST[p.id]).length, g.parts.length]; }
function rowCount(r){
  let a=0,b=0; r.groups.forEach(g=>{const c=count(g); a+=c[0]; b+=c[1];}); return [a,b];
}

function render(){
  [...tabs.children].forEach(b => b.setAttribute('aria-selected', b.dataset.f === cur));
  const f = DATA.floors.find(x => x.id === cur);
  const m = document.getElementById('main');
  m.className = f.id.toLowerCase().replace('f','f');
  let h = '';
  h += '<div class="tools">'
     + '<button id="exp">굽기용 내보내기</button>'
     + '<button id="clr">이 층 체크 지움</button></div>';
  if (f.plan){
    h += '<div class="planwrap"><img src="'+esc(f.plan)+'" alt="'+esc(f.label)+' 배치도">';
    f.marks.forEach(k => {
      h += '<div class="mk" data-code="'+esc(k.code)+'" style="left:'+k.x+'%;top:'+k.y+'%">'
         + '<b>'+esc(k.n)+'</b>'+(k.tag?'<span>'+esc(k.tag)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  const withMark = f.marks.length;
  h += '<p class="note">위치 표시 '+withMark+'개 &middot; 제품 '+f.rows.length+'줄'
     + (withMark < f.rows.length ? ' — 나머지는 배치도에 위치가 아직 안 찍혀 있습니다' : '') + '</p>';

  f.rows.forEach((r, i) => {
    const [a,b] = rowCount(r);
    const cls = b===0 ? 'none' : (a===b ? 'done' : '');
    const rid = 'row-'+f.id+'-'+i;
    h += '<div class="row'+(OPEN.has(rid)?' open':'')+'" id="'+rid+'">'
       + '<button class="rhead" data-i="'+i+'">'
       + '<span class="rcode">'+esc(r.code)+'</span>'
       + '<span class="rname">'+esc(r.name)+'<span class="rmeta">'+esc(r.meta)+'</span></span>'
       + '<span class="prog '+cls+'">'+(b ? a+'/'+b : '도면 없음')+'</span>'
       + '</button><div class="panel">';
    // 먼저 «PDF 에서 뽑은 상세도» — 현황판과 같은 그림. 그 아래로 부품이 쫙.
    if (r.ref){
      h += '<div class="ref"><img src="'+esc(r.ref)+'" alt="'+esc(r.code)+' 상세도" loading="lazy"'
         + ' data-zoom="'+esc(r.ref)+'" data-cap="'+esc(r.code+' · '+r.name)+'">'
         + (r.note ? '<p class="rnote">'+esc(r.note)+'</p>' : '') + '</div>';
    }
    if (!r.groups.length){
      h += '<p class="empty">이 제품의 도면이 아직 연결되지 않았습니다.</p>';
    } else {
      h += '<p class="parthead">부품 '+b+'종'+(a?' · 확인 '+a:'')+'</p>';
    }
    r.groups.forEach(g => {
      const [ga,gb] = count(g);
      h += '<div class="grp"><div class="gtop">';
      if (g.img) h += '<img src="'+esc(g.img)+'" alt="" data-zoom="'+esc(g.img)+'" data-cap="'+esc(g.title||g.prod)+'">';
      h += '<div><div class="gtit">UJLB-'+esc(g.prod)+'</div>'
         + '<div class="gsub">'+esc(g.title||'')+'</div>'
         + '<div class="gsub">부품 '+gb+'종 &middot; 확인 '+ga+'</div></div></div>';
      // 부품 도면을 한 장에 다 모아둔 것 — 눌러서 크게 보고 돋보기로 훑는다
      if (g.all){
        h += '<div class="allw"><div class="allh">부품 도면 한눈에 보기 &mdash; 눌러서 크게</div>'
           + '<img class="allimg" src="'+esc(g.all)+'" alt="" loading="lazy"'
           + ' data-zoom="'+esc(g.all)+'" data-cap="'+esc('UJLB-'+g.prod+' 부품 도면 전체')+'"></div>';
      }

        h += '<table><thead><tr><th style="width:34px"></th><th>품명</th>'

           + '<th class="h">도면번호</th><th style="width:56px">도면</th></tr></thead><tbody>';
        g.parts.forEach((p, pi) => {
          h += '<tr class="'+(ST[p.id]?'on':'')+'" data-id="'+esc(p.id)+'">'
             + '<td><input class="chk" type="checkbox" '+(ST[p.id]?'checked':'')+'></td>'
             + '<td class="pn">'+esc(p.name)+'</td>'
             + '<td class="h">'+esc(p.mat)+'</td><td class="h">'+esc(p.thk)+'</td>'
             + '<td class="n"><b>'+esc(p.qty||'-')+'</b>'+(p.qty?' SET':'')+'</td>'
             + '<td class="n h">'+esc(p.ea||'-')+'</td>'
             + '<td class="h"><span style="font:12px var(--mono)">'+esc(p.code)+'</span></td>'
             + '<td>'+(p.img
                 ? '<img class="dw" src="'+esc(p.img)+'" alt="" data-g="'+esc(g.prod)+'" data-pi="'+pi+'">'
                 : '<span class="nodw">없음</span>')+'</td></tr>';
        });
        h += '</tbody></table>';
      }
      h += '</div>';
    });
    h += '</div></div>';
  });
  m.innerHTML = h;

  // 펼친 줄은 기억한다 — 도면 보고 닫아도 부품 목록이 그대로 있어야 한다
  m.querySelectorAll('.rhead').forEach(b => b.onclick = () => {
    const el = b.parentElement;
    el.classList.toggle('open');
    if (el.classList.contains('open')) OPEN.add(el.id); else OPEN.delete(el.id);
  });
  m.querySelectorAll('.chk').forEach(c => c.onchange = e => {
    const tr = e.target.closest('tr');
    ST[tr.dataset.id] = e.target.checked || undefined;
    if (!e.target.checked) delete ST[tr.dataset.id];
    save(); render();
  });
  // 제품 대표 이미지 — 한 장만
  m.querySelectorAll('[data-zoom]').forEach(im => im.onclick = () => openOne(im.dataset.zoom, im.dataset.cap));
  // 부품 도면 — 좌우 화살표로 같은 제품의 다음 부품까지 넘겨본다
  m.querySelectorAll('.dw[data-g]').forEach(im => im.onclick = () => {
    const g = f.rows.flatMap(r => r.groups).find(x => x.prod === im.dataset.g);
    openList(g.parts.filter(p => p.img), g.parts.filter(p => p.img)
             .findIndex(p => p === g.parts[+im.dataset.pi]));
  });
  m.querySelectorAll('.mk').forEach(k => k.onclick = () => {
    const idx = f.rows.findIndex(r => r.code.replace(/[\s_-]/g,'').toUpperCase()
                                   === k.dataset.code.replace(/[\s_-]/g,'').toUpperCase());
    if (idx < 0) return;
    const el = document.getElementById('row-'+f.id+'-'+idx);
    el.classList.add('open');
    el.scrollIntoView({behavior:'smooth', block:'center'});
  });
  document.getElementById('exp').onclick = () => {
    const t = JSON.stringify(ST, null, 1);
    navigator.clipboard?.writeText(t);
    const b = new Blob([t], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = '재고확인-체크.json'; a.click();
  };
  document.getElementById('clr').onclick = () => {
    if (!confirm(f.label+' 체크를 모두 지울까요?')) return;
    f.rows.forEach(r => r.groups.forEach(g => g.parts.forEach(p => { delete ST[p.id]; })));
    save(); render();
  };
  let A=0,B=0;
  DATA.floors.forEach(ff => ff.rows.forEach(r => { const c = rowCount(r); A+=c[0]; B+=c[1]; }));
  document.getElementById('sub').textContent =
    '부품 '+B+'종 중 '+A+'종 확인 · 체크는 이 브라우저에만 저장됩니다';
}
// ── 도면 크게 보기 (좌우로 다음 부품) ──
const dlg = document.getElementById('dlg');
let LIST = [], IDX = 0;
// ── 돋보기 (확대·끌어서 움직이기) ──
let Z = 1, PX = 0, PY = 0, drag = null;
const dwrap = dlg.querySelector('.dwrap');
const dimg = dlg.querySelector('img');
function apply(){
  dimg.style.transform = 'translate('+PX+'px,'+PY+'px) scale('+Z+')';
  dlg.querySelector('.zlv').textContent = Math.round(Z * 100) + '%';
  dwrap.classList.toggle('grab', Z > 1);
}
function zoom(f, cx, cy){
  const b = dwrap.getBoundingClientRect();
  const ox = (cx === undefined ? b.width / 2 : cx - b.left) - b.width / 2;
  const oy = (cy === undefined ? b.height / 2 : cy - b.top) - b.height / 2;
  const n = Math.min(8, Math.max(1, Z * f));
  const k = n / Z;
  PX = ox - (ox - PX) * k;
  PY = oy - (oy - PY) * k;
  Z = n;
  if (Z === 1){ PX = 0; PY = 0; }
  apply();
}
function fit(){ Z = 1; PX = 0; PY = 0; apply(); }
dlg.querySelectorAll('.dbar [data-z]').forEach(b => b.onclick = e => {
  e.stopPropagation();
  const k = b.dataset.z;
  if (k === 'in') zoom(1.4); else if (k === 'out') zoom(1 / 1.4); else fit();
});
dlg.querySelector('.dclose').onclick = () => dlg.close();
dwrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY);
}, {passive: false});
dwrap.addEventListener('pointerdown', e => {
  if (Z <= 1 || e.target.closest('.nav')) return;
  drag = {x: e.clientX - PX, y: e.clientY - PY};
  dwrap.classList.add('grabbing');
  dwrap.setPointerCapture(e.pointerId);
});
dwrap.addEventListener('pointermove', e => {
  if (!drag) return;
  PX = e.clientX - drag.x; PY = e.clientY - drag.y; apply();
});
dwrap.addEventListener('pointerup', () => { drag = null; dwrap.classList.remove('grabbing'); });
dimg.addEventListener('dblclick', e => zoom(Z > 1 ? 1 / Z : 2.5, e.clientX, e.clientY));

function paint(){
  const p = LIST[IDX];
  fit();
  dlg.querySelector('img').src = p.img;
  dlg.querySelector('.cap').innerHTML =
      '<b>'+esc(p.name)+'</b>'
    + (p.qty ? ' <span class="q">'+esc(p.qty)+' SET</span>' : '')
    + '<span class="c2">'+esc(p.code)+'</span>'
    + (LIST.length > 1 ? '<span class="c2">'+(IDX+1)+' / '+LIST.length+'</span>' : '');
  dlg.querySelectorAll('.nav').forEach(b => b.hidden = LIST.length < 2);
  const chk = dlg.querySelector('.dchk');
  chk.hidden = !p.id;
  if (p.id) chk.querySelector('input').checked = !!ST[p.id];
}
function openList(list, i){
  if (!list.length) return;
  LIST = list; IDX = Math.max(0, i);
  paint(); if (!dlg.open) dlg.showModal();
}
function openOne(src, cap){
  LIST = [{img: src, name: cap || '', code: '', qty: ''}]; IDX = 0;
  paint(); if (!dlg.open) dlg.showModal();
}
function step(d){ if (LIST.length > 1){ IDX = (IDX + d + LIST.length) % LIST.length; paint(); } }
dlg.querySelector('.prev').onclick = e => { e.stopPropagation(); step(-1); };
dlg.querySelector('.next').onclick = e => { e.stopPropagation(); step(1); };
dlg.querySelector('.dchk input').onchange = e => {
  const p = LIST[IDX];
  if (e.target.checked) ST[p.id] = 1; else delete ST[p.id];
  save(); paint();
};
dlg.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
});
dlg.addEventListener('close', () => render());
dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
render();
</script></body></html>
